# Configuration file for monitor_cups_activity.sh
# Provides default values for script execution

defaults:
  # Output file for print activity summary (data is appended for historical tracking)
  output_file: "/var/log/print_activity.csv"
  

  # Date range for monitoring (YYYY-MM-DD format)
  # If both start_date and end_date are set, they override time_period_hours
  # Leave blank or comment out to use time_period_hours instead
  start_date: ""  # Example: "2025-11-01"
  end_date: ""    # Example: "2025-11-07"

  # Time period to monitor (in hours)
  # How many hours back to look for print activity
  time_period_hours: 24
  
  # Email settings
  email:
    # Email address to send results to
    recipient: "wwillett@institute.org"
    
    # Email subject line
    subject: "CUPS Print Activity Report - $(hostname)"
    
    # SMTP settings (if using external SMTP)
    # Leave empty to use local mail system
    smtp_server: ""
    smtp_port: ""
    smtp_username: ""
    smtp_password: ""
    
    # Whether to attach the CSV file to the email
    attach_csv: true
    
    # Whether to include the summary in the email body
    include_summary_in_body: true
  
  # Logging settings
  log_file: "/var/log/monitor_cups_activity.log"
  
  # Temporary directory for working files
  temp_dir: "/tmp"
  
  # Enable debug mode (boolean)
  debug: false
  
  # Enable verbose mode (boolean)
  verbose: false
  
  # Dry run mode - show what would be done without actually doing it (boolean)
  dry_run: false
  
  # CUPS log locations
  cups:
    # CUPS configuration file to check logging method
    config_file: "/etc/cups/cups-files.conf"
    
    # File-based log locations
    page_log: "/var/log/cups/page_log"
    access_log: "/var/log/cups/access_log"
    error_log: "/var/log/cups/error_log"
    
    # Systemd service name for journal-based logging
    service_name: "cups"

